    date: "2023-02-15"
    summary: "New certified defenses reduce robust regression to classification, expanding guarantees against poisoning attacks."
    links:
      - label: "Paper"
        url: "/files/hammoudeh-satml23.pdf"
  - title: "JMLR 2023: Influence Estimation for Tree Ensembles"
    date: "2023-02-01"
    summary: "Jonathan Brophy and Zayd Hammoudeh led a comprehensive evaluation of influence methods for gradient-boosted trees."
    links:
      - label: "Paper"
        url: "/files/brophy-jmlr23.pdf"
  - title: "NeurIPS 2022: Uncertainty for Gradient-Boosted Trees"
    date: "2022-11-30"
